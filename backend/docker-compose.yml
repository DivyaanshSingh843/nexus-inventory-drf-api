version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nexus_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_admin} -d ${POSTGRES_DB:-nexus_inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine
    container_name: nexus_memcached_cache
    ports:
      - "11211:11211"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_django_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=django-insecure-enterprise-hub-secret-key-change-in-production
      - POSTGRES_DB=${POSTGRES_DB:-nexus_inventory_db}
      - POSTGRES_USER=${POSTGRES_USER:-nexus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexus_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - CELERY_BROKER_URL=memory://
      - CELERY_RESULT_BACKEND=cache+memcached://memcached:11211/
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=django-insecure-enterprise-hub-secret-key-change-in-production
      - POSTGRES_DB=${POSTGRES_DB:-nexus_inventory_db}
      - POSTGRES_USER=${POSTGRES_USER:-nexus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexus_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MEMCACHED_HOST=memcached
      - MEMCACHED_PORT=11211
      - CELERY_BROKER_URL=rpc://
      - CELERY_RESULT_BACKEND=cache+memcached://memcached:11211/
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started

volumes:
  postgres_data:
